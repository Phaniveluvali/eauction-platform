name: CI/CD - Catalog & Identity Service

on:
  push:
    branches: [ main ]
    paths:
      - 'catalog-identity-service/**'
  workflow_dispatch:

concurrency:
  group: cicd-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-deploy:
    name: Build, Push & Deploy Catalog Identity Service
    runs-on: [ self-hosted, linux, wsl ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./catalog-identity-service
          file: ./catalog-identity-service/Dockerfile
          push: true
          tags: |
            krishnaveluvali/eauction-catalog-identity:${{ steps.vars.outputs.sha_short }}
            krishnaveluvali/eauction-catalog-identity:latest

      - name: Update Helm Values (GitOps Handshake)
        run: |
          NEW_TAG="${{ steps.vars.outputs.sha_short }}"
          python3 scripts/update-image-tag.py catalogIdentity "$NEW_TAG" helm/eauction-platform/values.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/eauction-platform/values.yaml
          if git diff --staged --quiet; then
            echo "No changes in values.yaml to commit."
          else
            git commit -m "chore(gitops): update catalogIdentity image tag to $NEW_TAG [skip ci]"
            git push origin main
          fi
