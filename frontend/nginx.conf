server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle /seller-buyer context root and subpaths
    location /seller-buyer {
        try_files $uri $uri/ /seller-buyer/index.html /index.html;
    }

    # Root fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets direct serving
    location /assets/ {
        try_files $uri $uri/ =404;
    }

    location /seller-buyer/assets/ {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        try_files $uri $uri/ =404;
    }

    # Proxy to Java Catalog Identity Service
    location /api/v1/catalog {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/auth {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/auctions {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/sessions {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/catalog {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/auth {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/auctions {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/sessions {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy to Go WebSocket Bidding Engine with upgrade headers
    location /ws {
        proxy_pass http://eauction-bidding-engine:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /seller-buyer/ws {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-bidding-engine:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy to Node.js Payment Broker
    location /api/v1/payments {
        proxy_pass http://eauction-payment-broker:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/payments {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-payment-broker:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
