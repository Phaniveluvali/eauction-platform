server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression Optimization (Reduces transfer sizes by up to 80-90%)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Handle /seller-buyer context root and subpaths
    location /seller-buyer {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /seller-buyer/index.html /index.html;
    }

    # Root fallback
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Static assets: Aggressive immutable browser caching for Vite hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
    }

    location /seller-buyer/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        rewrite ^/seller-buyer(/.*)$ $1 break;
        try_files $uri $uri/ =404;
    }

    # Proxy to Java Catalog Identity Service
    location /api/v1/catalog {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    location /api/v1/auth {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/auctions {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    location /api/v1/sessions {
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/catalog {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    location /seller-buyer/api/v1/auth {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/auctions {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    location /seller-buyer/api/v1/sessions {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-catalog-identity:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy to Go WebSocket Bidding Engine with upgrade headers
    location /ws {
        proxy_pass http://eauction-bidding-engine:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /seller-buyer/ws {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-bidding-engine:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Proxy to Node.js Payment Broker
    location /api/v1/payments {
        proxy_pass http://eauction-payment-broker:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /seller-buyer/api/v1/payments {
        rewrite ^/seller-buyer(/.*)$ $1 break;
        proxy_pass http://eauction-payment-broker:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
