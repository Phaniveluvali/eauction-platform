apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          maxLines: 1000

      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://alertmanager:9093
        editable: false
        jsonData:
          implementation: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Al Wataneya Infrastructure & Microservices'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-custom-dashboards
  namespace: monitoring
data:
  host-infrastructure.json: |
    {
      "title": "1. Host & Server Infrastructure Health (RHEL 9.7)",
      "timezone": "browser",
      "refresh": "10s",
      "panels": [
        {
          "title": "Host CPU Utilization (%)",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [{ "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[1m])) * 100)" }],
          "fieldConfig": { "defaults": { "min": 0, "max": 100, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 75 }, { "color": "red", "value": 90 }] } } }
        },
        {
          "title": "Available Memory (GiB)",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [{ "expr": "node_memory_MemAvailable_bytes / 1024 / 1024 / 1024" }],
          "fieldConfig": { "defaults": { "min": 0, "max": 20, "unit": "decgbytes", "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "orange", "value": 2 }, { "color": "green", "value": 4 }] } } }
        },
        {
          "title": "Root Filesystem (/) Used (%)",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [{ "expr": "100 - ((node_filesystem_avail_bytes{mountpoint=\"/host/root\"} / node_filesystem_size_bytes{mountpoint=\"/host/root\"}) * 100)" }],
          "fieldConfig": { "defaults": { "min": 0, "max": 100, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 }] } } }
        },
        {
          "title": "System Load (1m, 5m, 15m)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [
            { "expr": "node_load1", "legendFormat": "1 min" },
            { "expr": "node_load5", "legendFormat": "5 min" },
            { "expr": "node_load15", "legendFormat": "15 min" }
          ]
        },
        {
          "title": "Memory Breakdown (Active, Buff/Cache, Free)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / 1024 / 1024 / 1024", "legendFormat": "Used (GiB)" },
            { "expr": "node_memory_Buffers_bytes + node_memory_Cached_bytes / 1024 / 1024 / 1024", "legendFormat": "Buffers/Cached (GiB)" },
            { "expr": "node_memory_MemFree_bytes / 1024 / 1024 / 1024", "legendFormat": "Free (GiB)" }
          ]
        },
        {
          "title": "Network Traffic (Inbound / Outbound KB/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "expr": "rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cali.*\"}[1m]) / 1024", "legendFormat": "Inbound (KB/s)" },
            { "expr": "rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cali.*\"}[1m]) / 1024", "legendFormat": "Outbound (KB/s)" }
          ]
        }
      ]
    }

  kubernetes-workloads.json: |
    {
      "title": "2. Kubernetes Cluster & Pod Workload Overview",
      "timezone": "browser",
      "refresh": "10s",
      "panels": [
        {
          "title": "Active Pods by Namespace",
          "type": "bargauge",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "targets": [{ "expr": "count by (namespace) (kube_pod_status_phase{phase=\"Running\"})" }]
        },
        {
          "title": "Container Restarts (Last 1 Hour)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "targets": [{ "expr": "increase(kube_pod_container_status_restarts_total[1h]) > 0", "legendFormat": "{{pod}} ({{container}})" }]
        },
        {
          "title": "OOM Killed Containers Count",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "targets": [{ "expr": "sum(kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"})" }],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } }
        },
        {
          "title": "Top Pods by Memory Consumption (MiB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [{ "expr": "topk(8, container_memory_working_set_bytes{container!=\"\"}) / 1024 / 1024", "legendFormat": "{{pod}} - {{container}}" }]
        },
        {
          "title": "Top Pods by CPU Usage (Millicores)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [{ "expr": "topk(8, rate(container_cpu_usage_seconds_total{container!=\"\"}[1m])) * 1000", "legendFormat": "{{pod}} - {{container}}" }]
        }
      ]
    }

  live-logs-anomalies.json: |
    {
      "title": "3. Live Log Explorer & Anomaly Detection (Loki)",
      "timezone": "browser",
      "refresh": "5s",
      "panels": [
        {
          "title": "Error Log Spikes (Errors / Min)",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "sum by (app) (count_over_time({namespace=~\"eauction|monitoring|ingress-nginx\"} |= \"ERROR\" [1m]))",
              "legendFormat": "{{app}} Errors"
            },
            {
              "datasource": "Loki",
              "expr": "sum by (app) (count_over_time({namespace=~\"eauction|monitoring|ingress-nginx\"} |= \"WARN\" [1m]))",
              "legendFormat": "{{app}} Warnings"
            }
          ]
        },
        {
          "title": "Live Pod Log Stream (WebSocket Live Tail)",
          "type": "logs",
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 6 },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "{namespace=~\"eauction|monitoring\"}"
            }
          ],
          "options": {
            "showLabels": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: "https://tecnics-internal.online/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 80Mi
            limits:
              cpu: 300m
              memory: 200Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: custom-dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: storage
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: custom-dashboards
          configMap:
            name: grafana-custom-dashboards
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
