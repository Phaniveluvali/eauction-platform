apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozzle
  namespace: monitoring
  labels:
    app.kubernetes.io/name: dozzle
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dozzle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dozzle
    spec:
      containers:
        - name: dozzle
          image: docker.io/amir20/dozzle:latest
          env:
            - name: DOZZLE_BASE
              value: "/logs"
            - name: DOZZLE_LEVEL
              value: "info"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 100m
              memory: 50Mi
          volumeMounts:
            - name: containerd-sock
              mountPath: /var/run/docker.sock
              readOnly: true
      volumes:
        - name: containerd-sock
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: dozzle
  namespace: monitoring
  labels:
    app.kubernetes.io/name: dozzle
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: dozzle
