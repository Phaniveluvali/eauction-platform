apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'eauction-alerts@tecnics-internal.online'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace', 'job', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'email-alert-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'email-alert-notifications'
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: 'email-alert-notifications'
          repeat_interval: 4h

    receivers:
      - name: 'email-alert-notifications'
        email_configs:
          - to: 'myset2014@gmail.com'
            send_resolved: true
            headers:
              Subject: '🚨 [{{ .Status | toUpper }}] Al Wataneya E-Auction Alert: {{ .GroupLabels.alertname }}'
            html: |
              <h2>🚨 Al Wataneya Infrastructure & Microservices Alert</h2>
              <p><strong>Status:</strong> {{ .Status | toUpper }}</p>
              <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
              <hr/>
              {{ range .Alerts }}
                <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
                <p><strong>Namespace:</strong> {{ .Labels.namespace }}</p>
                <p><strong>Pod/Component:</strong> {{ .Labels.pod }} {{ .Labels.instance }}</p>
                <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
                <p><strong>Description:</strong> {{ .Annotations.description }}</p>
                <p><strong>Time:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}</p>
                <br/>
              {{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.26.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address="
          ports:
            - name: web
              containerPort: 9093
          resources:
            requests:
              cpu: 10m
              memory: 25Mi
            limits:
              cpu: 100m
              memory: 80Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
spec:
  ports:
    - name: web
      port: 9093
      targetPort: 9093
  selector:
    app.kubernetes.io/name: alertmanager
