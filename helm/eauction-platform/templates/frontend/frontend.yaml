{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eauction-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: eauction-frontend
    {{- include "eauction-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: eauction-frontend
  template:
    metadata:
      labels:
        app: eauction-frontend
        {{- with .Values.frontend.labels.pod }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.frontend.annotations.pod }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: eauction-frontend-sa
      priorityClassName: auction-low-priority
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "eauction-platform.podAntiAffinity" (dict "app" "eauction-frontend" "soft" .Values.global.softScheduling) | nindent 6 }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
              name: http
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: {{ .Values.frontend.probes.readinessProbe.initialDelaySeconds | default 3 }}
            periodSeconds: {{ .Values.frontend.probes.readinessProbe.periodSeconds | default 5 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: {{ .Values.frontend.probes.livenessProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.frontend.probes.livenessProbe.periodSeconds | default 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: eauction-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: eauction-frontend
    {{- with .Values.frontend.labels.service }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.frontend.annotations.service }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.port }}
      name: http
  selector:
    app: eauction-frontend
{{- end }}
