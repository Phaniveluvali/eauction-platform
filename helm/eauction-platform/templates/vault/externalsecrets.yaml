{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eauction-vault-sync
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.vault.targetSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.vault.secretPath }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eauction-docker-secret-sync
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: eauction-docker-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":"{{ .DOCKER_USERNAME }}","password":"{{ .DOCKER_PASSWORD }}","auth":"{{ .DOCKER_AUTH }}"}}}'
  data:
    - secretKey: DOCKER_USERNAME
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: DOCKER_USERNAME
    - secretKey: DOCKER_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: DOCKER_PASSWORD
    - secretKey: DOCKER_AUTH
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: DOCKER_AUTH
{{- end }}
