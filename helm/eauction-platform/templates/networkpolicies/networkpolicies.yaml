---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-broker-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: eauction-payment-broker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
        - ipBlock:
