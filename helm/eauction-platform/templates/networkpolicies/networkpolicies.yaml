        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 8082
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: eauction-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: eauction-kafka
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: eauction-frontend
  policyTypes:
    - Ingress
  ingress:
    # Allow HTTP from Ingress controller only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
        - ipBlock:
            cidr: 172.16.0.0/16
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stateful-tier-isolation
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - eauction-postgres
          - eauction-redis
          - eauction-redis-sentinel
          - eauction-kafka
          - eauction-zookeeper
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Postgres accepts from Catalog, Keycloak, AI service, Payment broker + replication
    - from:
        - podSelector:
            matchLabels:
              app: eauction-catalog-identity
        - podSelector:
            matchLabels:
              app: eauction-keycloak
        - podSelector:
            matchLabels:
              app: eauction-ai-service
        - podSelector:
            matchLabels:
              app: eauction-payment-broker
        - podSelector:
            matchLabels:
              app: eauction-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Redis accepts from Bidding Engine, AI service + replication
    - from:
        - podSelector:
            matchLabels:
              app: eauction-bidding-engine
        - podSelector:
            matchLabels:
              app: eauction-ai-service
        - podSelector:
            matchLabels:
              app: eauction-redis
        - podSelector:
            matchLabels:
              app: eauction-redis-sentinel
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    # Kafka accepts from Bidding Engine, Catalog, AI service, Payment broker, Zookeeper
    - from:
        - podSelector:
            matchLabels:
              app: eauction-bidding-engine
        - podSelector:
            matchLabels:
              app: eauction-catalog-identity
        - podSelector:
            matchLabels:
              app: eauction-ai-service
        - podSelector:
            matchLabels:
              app: eauction-payment-broker
        - podSelector:
            matchLabels:
              app: eauction-kafka
        - podSelector:
            matchLabels:
              app: eauction-zookeeper
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 2181
  egress:
    # Allow replication between database & message bus instances
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - eauction-postgres
                  - eauction-redis
                  - eauction-redis-sentinel
                  - eauction-kafka
                  - eauction-zookeeper
{{- end }}
