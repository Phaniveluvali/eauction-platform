{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-system-dns-monitoring
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus monitoring scrape from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.monitoringNamespace }}
  egress:
    # Allow DNS resolution universally (CoreDNS Service IP & Pods)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bidding-engine-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: eauction-bidding-engine
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow WebSocket connections from Ingress controller (host network or cluster IP)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
        - ipBlock:
            cidr: 172.16.0.0/16
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Egress to Redis Master & Sentinel
    - to:
        - podSelector:
            matchLabels:
              app: eauction-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: eauction-redis-sentinel
      ports:
        - protocol: TCP
          port: 26379
    # Egress to Kafka Event Stream
    - to:
        - podSelector:
            matchLabels:
              app: eauction-kafka
      ports:
        - protocol: TCP
          port: 9092
    # Egress to Keycloak for token inspection
    - to:
        - podSelector:
            matchLabels:
              app: eauction-keycloak
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-identity-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: eauction-catalog-identity
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
        - ipBlock:
            cidr: 172.16.0.0/16
        - ipBlock:
            cidr: 127.0.0.1/32
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Egress to PostgreSQL Database
    - to:
        - podSelector:
            matchLabels:
              app: eauction-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Egress to Kafka Event Bus
    - to:
        - podSelector:
            matchLabels:
              app: eauction-kafka
      ports:
        - protocol: TCP
          port: 9092
    # Egress to Keycloak for auth validation
    - to:
        - podSelector:
            matchLabels:
              app: eauction-keycloak
      ports:
        - protocol: TCP
          port: 8080
    # Egress to local Postfix on host port 5433 for email dispatch
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5433
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: eauction-keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP from Ingress controller and internal services
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.ingressNamespace }}
        - ipBlock:
            cidr: 172.16.0.0/16
        - ipBlock:
            cidr: 127.0.0.1/32
        - podSelector:
            matchLabels:
              app: eauction-bidding-engine
        - podSelector:
            matchLabels:
              app: eauction-catalog-identity
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: eauction-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-service-policy
