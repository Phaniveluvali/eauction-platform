# ==============================================================================
# SECTION 12: INGRESS ROUTING & TLS TERMINATION
# ==============================================================================
# Kubernetes Ingress configuration for Ingress-Nginx reverse proxy.
# Manages multi-host routing, SSL termination, and real-time WebSocket protocol upgrades.
ingress:
  # Master toggle to create the Ingress resource
  enabled: true

  # Ingress controller class name
  className: "nginx"

  # NGINX-specific annotations for performance, timeouts, and WebSocket support
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "eauction-bidding-engine"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"

  # Custom additional annotations for Ingress
  # Sample "customAnnotations" configuration:
  # customAnnotations:
  #   cert-manager.io/cluster-issuer: "letsencrypt-prod"
  #   nginx.ingress.kubernetes.io/limit-rps: "100"
  customAnnotations: {}

# ==============================================================================
# SECTION 13: LOGGING CONFIGURATION
# ==============================================================================
# Fine-grained log level configuration per microservice.
# Supported levels: "DEBUG", "INFO", "WARN", "ERROR"
logging:
  biddingEngine: "INFO"
  catalogIdentity: "INFO"
  keycloak: "INFO"
  aiService: "INFO"
  paymentBroker: "INFO"

# ==============================================================================
# SECTION 14: METRICS & OBSERVABILITY
# ==============================================================================
# Prometheus scraping configuration for microservices metrics endpoints.
metrics:
  # Master toggle to enable metrics exposition annotations
  enabled: true
  # Discovery mode: "annotation" (default Pod annotations) or "serviceMonitor" (Prometheus Operator CRD)
  discoveryType: "annotation"
  endpoints:
    catalogIdentity: "/actuator/prometheus"
    aiService: "/metrics"
    keycloak: "/auth/metrics"

# ==============================================================================
# SECTION 15: MAINTENANCE MODE
# ==============================================================================
# Starts specified microservice pods in idle sleep mode (/bin/sh -c 'sleep 3600')
# without starting the main server binary. Enables operators to exec into containers
# to debug database connectivity, file permissions, or network routing without crashes.
maintenanceMode:
  biddingEngine: false
  catalogIdentity: false
  keycloak: false
  frontend: false
  aiService: false
  paymentBroker: false
