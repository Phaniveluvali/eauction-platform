{{- if .Values.priorityClasses.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: auction-critical-stateful
value: 1000000
globalDefault: false
description: "Mission-critical stateful infrastructure (Postgres, Redis, Kafka) immune to OOM preemption."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: auction-high-priority
value: 800000
globalDefault: false
description: "Core real-time auction microservices (Bidding Engine, Catalog, Keycloak)."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: auction-low-priority
value: 100000
globalDefault: false
description: "Batch processing, asynchronous workers, and non-blocking background tasks."
{{- end }}
