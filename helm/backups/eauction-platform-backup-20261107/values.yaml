global:
  environment: "single-node"
  domain: "tecnics-internal.online"
  altDomain: "eauction.tecnics-internal.online"
  tlsSecretName: "ca-vmx-tls-cert"
  softScheduling: true

priorityClasses:
  enabled: true

networkPolicies:
  enabled: true
  monitoringNamespace: "monitoring"
  ingressNamespace: "ingress-nginx"

podDisruptionBudgets:
  enabled: true

vault:
  enabled: true
  clusterSecretStore: "vault-backend"
  secretPath: "secret/data/eauction"
  targetSecretName: "eauction-secret"

biddingEngine:
  replicaCount: 3
  image:
    repository: "eauction-bidding-engine"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    port: 8081
    nodePort: 30381
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilization: 70
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

catalogIdentity:
  replicaCount: 2
  image:
    repository: "eauction-catalog-identity"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    port: 8080
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1536Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilization: 80
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

keycloak:
  replicaCount: 1
  image:
    repository: "quay.io/keycloak/keycloak"
    tag: "24.0.5"
    pullPolicy: "IfNotPresent"
  service:
    port: 8080
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "1536Mi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

frontend:
  replicaCount: 2
  image:
    repository: "eauction-frontend"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  securityContext:
    allowPrivilegeEscalation: false

aiService:
  replicaCount: 2
  image:
    repository: "eauction-ai-service"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    port: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

paymentBroker:
  replicaCount: 2
  image:
    repository: "eauction-payment-broker"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  service:
    port: 8082
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "384Mi"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "eauction-bidding-engine"
