spring.application.name=catalog-identity-service
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eauction_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool High-Concurrency Tuning
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:50}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:15}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}

# Embedded Tomcat Worker Threads Tuning for High-Concurrency Logins
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:400}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:50}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:10000}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=catalog-identity-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# JWT HS256 Configuration (Must be >= 256 bits / 32 bytes for HS256)
jwt.secret=${JWT_SECRET:eauction_secret_jwt_signing_key_32bytes_minimum_length_production_ready_value!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.eauction=DEBUG

# Email SMTP Configuration (Configure with Gmail, SendGrid, Brevo, AWS SES, or custom corporate SMTP)
spring.mail.host=${SPRING_MAIL_HOST:202.153.35.221}
spring.mail.port=${SPRING_MAIL_PORT:5433}
spring.mail.username=${SPRING_MAIL_USERNAME:phani_veluvali@tecnics.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:phani_veluvali@tecnics.com}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.trust=*
