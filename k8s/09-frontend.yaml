apiVersion: apps/v1
kind: Deployment
metadata:
  name: eauction-frontend
  namespace: eauction
  labels:
    app: eauction-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eauction-frontend
  template:
    metadata:
      labels:
        app: eauction-frontend
    spec:
      containers:
        - name: frontend
          image: eauction-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: eauction-frontend
  namespace: eauction
  labels:
    app: eauction-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30300
      name: http
  selector:
    app: eauction-frontend
