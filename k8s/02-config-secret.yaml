apiVersion: v1
kind: Secret
metadata:
  name: eauction-secret
  namespace: eauction
type: Opaque
stringData:
  POSTGRES_DB: "eauction_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  JWT_SECRET: "eauction_secret_jwt_signing_key_32bytes_minimum_length_production_ready_value!"
  RAZORPAY_WEBHOOK_SECRET: "rzp_test_secret_key_indian_auctions"
  CASHFREE_WEBHOOK_SECRET: "cf_test_secret_key_indian_auctions"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eauction-config
  namespace: eauction
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://eauction-postgres:5432/eauction_db"
  SPRING_DATASOURCE_READ_URL: "jdbc:postgresql://eauction-postgres-replica:5432/eauction_db"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "50"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "15"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
  SERVER_TOMCAT_THREADS_MAX: "400"
  SERVER_TOMCAT_THREADS_MIN_SPARE: "50"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "eauction-kafka:9092"
  REDIS_ADDR: "eauction-redis:6379"
  REDIS_SENTINEL_ADDRS: "eauction-redis-sentinel:26379"
  REDIS_MASTER_NAME: "mymaster"
  KAFKA_BROKERS: "eauction-kafka:9092"
  KAFKA_BID_TOPIC: "vehicle-bids-topic"
  KAFKA_PAYMENT_TOPIC: "vehicle-payments-topic"
  NOTIFICATION_WHATSAPP_URL: "http://202.153.35.221:8085/message/sendText"
  NOTIFICATION_WHATSAPP_INSTANCE: "alwataneya-prod"
  NOTIFICATION_WHATSAPP_APIKEY: "alwataneya-wa-key"
  SPRING_MAIL_HOST: "202.153.35.221"
  SPRING_MAIL_PORT: "25"
  VITE_CATALOG_API_URL: "/api"
  VITE_BIDDING_WS_URL: "ws://tecnics-internal.online/ws"
  VITE_PAYMENT_API_URL: "/api/v1/payments"
