apiVersion: apps/v1
kind: Deployment
metadata:
  name: eauction-bidding-engine
  namespace: eauction
  labels:
    app: eauction-bidding-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eauction-bidding-engine
  template:
    metadata:
      labels:
        app: eauction-bidding-engine
    spec:
      containers:
        - name: bidding-engine
          image: eauction-bidding-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: ws
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: eauction-config
                  key: REDIS_ADDR
            - name: REDIS_SENTINEL_ADDRS
              valueFrom:
                configMapKeyRef:
                  name: eauction-config
                  key: REDIS_SENTINEL_ADDRS
            - name: REDIS_MASTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: eauction-config
                  key: REDIS_MASTER_NAME
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: eauction-config
                  key: KAFKA_BROKERS
            - name: KAFKA_BID_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: eauction-config
                  key: KAFKA_BID_TOPIC
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eauction-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: eauction-bidding-engine
  namespace: eauction
  labels:
    app: eauction-bidding-engine
spec:
  type: NodePort
  ports:
    - port: 8081
      targetPort: 8081
      nodePort: 30381
      name: ws
  selector:
    app: eauction-bidding-engine
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eauction-bidding-engine-hpa
  namespace: eauction
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eauction-bidding-engine
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
